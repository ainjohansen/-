# Zero-trust audit: minimal anchor set + experimental data table (v3)
# Only fundamental constants (alpha, M_p) + dimension base + experiment values
# All formulas must be DERIVED from text, not read from @tev tags
#
# Experimental data updated 2026-10-28: PDG 2024 / CODATA 2022 / NuFIT 6.0

anchors:
  # Fundamental dimensionless constant (impedance definition)
  alpha: 0.0072973525643
  # Mass anchor [M] in eV/c^2 (CODATA 2022)
  # В anchors.yaml или словаре парсера:
  M_p: 1.67262192369e-27,  # kg (для формул СИ)
  M_p_MeV: 938.27208943,  # MeV (для спектральных формул)

dimensions:
  # Base dimensions: M, L, T, I (mass, length, time, current)
  # Each physical quantity is a vector [M, L, T, I]
  alpha: [0, 0, 0, 0]       # dimensionless
  M_p: [1, 0, 0, 0]         # mass
  eV: [1, -2, -2, 0]        # energy = M L^2 T^-2 (in eV units)
  m: [0, 1, 0, 0]           # length
  s: [0, 0, 1, 0]           # time
  A: [0, 0, 0, 1]           # current

experiment:
  # ---- External experimental inputs (not derivable from alpha/M_p) ----
  # Graphene/twistronics parameters (external to the TEV model)
  a_graphene_nm: 0.246      # graphene lattice constant (nm)
  hbar_vF_eV_A: 5.924       # hbar * v_F (eV*A)
  w1_meV: 110               # tunneling amplitude w1 (meV)
  w0_meV: 89.8              # w_0 = sqrt(2/3)*w_1 from Mises criterion
  v_F_m_s: 1000000          # Fermi velocity in graphene (m/s, approx)
  theta_deg: 0.0189         # magic angle in radians ~1.08 deg
  theta_m_exp_deg: 1.08     # experimental magic angle TBG (deg)
  kB_eV_K: 8.617333262e-5   # Boltzmann constant (eV/K)
  c_m_s: 299792458          # speed of light (m/s)
  hbar_J_s: 1.054571817e-34 # reduced Planck constant (J*s)
  e_C: 1.602176634e-19      # elementary charge (C)
  n_e_m2: 1e15              # electron density (m^-2, typical)
  sigma_m: 0.1              # hydrostatic stress (eV/nm^2, typical)
  L_M_nm: 100               # moire period (nm, typical)
  J_2_eV: 0.01              # shear invariant J_2 (eV)
  sigma_dimless: 1.0        # dimensionless stress parameter
  phi_deg: 1.75             # golden ratio angle (deg)
  eta_nPa_s: 1e-6           # Hall viscosity (nPa*s, typical)

  # ---- PDG 2024 electroweak sector ----
  M_W_exp_GeV: 80.3692      # W boson mass (PDG 2024) +/- 0.0013
  M_Z_exp_GeV: 91.18798     # Z boson mass (PDG 2024) +/- 0.00020
  M_H_exp_GeV: 125.1995     # Higgs mass (PDG 2024) +/- 0.011
  sin2_thetaW_exp: 0.23129  # weak mixing angle (PDG 2024) +/- 0.00004
  G_F_exp_GeV2: 1.1663788e-5 # Fermi constant (PDG 2024) +/- 6e-10 GeV^-2
  m_tau_exp_MeV: 1776.932   # tau lepton mass (PDG 2024) +/- 0.085 MeV

  # ---- CODATA 2022 fundamental constants ----
  M_p_CODATA_2022: 938.27208943 # proton mass (CODATA 2022) +/- 2.9e-8
  G_N_CODATA_2022: 6.67430e-11  # Newton constant (CODATA 2022) m^3/(kg*s^2)
  hbar_c_MeV_fm: 197.3269804   # hbar*c (CODATA 2022) MeV*fm

  # ---- NuFIT 6.0 neutrino oscillation parameters ----
  dm2_21_exp: 7.5300e-5     # solar mass-squared difference (NuFIT 6.0)
  dm2_21_unc: 0.20e-5       # NuFIT 6.0 official uncertainty
  dm2_31_exp: 2.534e-3      # atmospheric mass-squared difference (NuFIT 6.0)
  sin2_theta12_exp: 0.300   # PMNS mixing angle (NuFIT 6.0)
  sin2_theta13_exp: 0.0213  # PMNS mixing angle (NuFIT 6.0)
  sin2_theta23_exp: 0.573   # PMNS mixing angle (NuFIT 6.0)
  delta_CP_exp: -1.0        # CP-violating phase (NuFIT 6.0, approximate)
  sum_m_nu_exp_max_eV: 0.072 # sum of neutrino masses (DESI+Planck 2024)

  # ---- Beta decay / double-beta search limits ----
  m_beta_beta_max_eV: 0.122 # effective Majorana mass limit (KamLAND-Zen 2025)
  tau_n_bottle_s: 879.4     # neutron lifetime (bottle, PDG 2024)
