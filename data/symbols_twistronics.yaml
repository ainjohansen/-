# ==============================================================================
# СЛОВАРЬ СИМВОЛОВ И РАЗМЕРНОСТЕЙ: ТВИСТРОНИКА v2.0 (SSOT)
# Базис СИ: [Масса (M), Длина (L), Время (T), Сила тока (I)]
# ==============================================================================

constants:
  hbar:
    latex: "\\hbar"
    dim: [1, 2, -1, 0]
    unit: "J*s"
    val: 1.054571817e-34
  v_F:
    latex: "v_F"
    dim: [0, 1, -1, 0]
    unit: "m/s"
    val: 1.0e6
    desc: "Скорость Ферми монослоя графена"
  a_lattice:
    latex: "a"
    dim: [0, 1, 0, 0]
    unit: "m"
    val: 2.46e-10
    desc: "Постоянная решетки монослоя графена (0.246 нм)"
  rho_2D:
    latex: "\\rho_{2D}"
    dim: [1, -2, 0, 0]
    unit: "kg/m^2"
    val: 7.6e-7
    desc: "Поверхностная плотность массы графена"
  G_2D:
    latex: "G_{2D}"
    dim: [1, 0, -2, 0]
    unit: "N/m"
    val: 144.0
    desc: "Двумерный модуль упругого сдвига монослоя"

moiré_kinematics:
  k_theta:
    latex: "k_\\theta"
    dim: [0, -1, 0, 0]
    unit: "m^-1"
    lean_thm: "TevTwistronics.moire_momentum_period_product"
    desc: "Муаровый импульсный масштаб: (4*pi / (3*a)) * theta"
  L_M:
    latex: "L_M"
    dim: [0, 1, 0, 0]
    unit: "m"
    lean_thm: "TevTwistronics.moire_momentum_period_product"
    desc: "Период муаровой сверхрешетки: a / theta"
  q_star:
    latex: "\\mathbf{q}_j"
    dim: [0, -1, 0, 0]
    unit: "m^-1"
    lean_thm: "TevTwistronics.three_wavevector_sum_zero"
    desc: "Звезда трех муаровых импульсов туннелирования (120°)"

mises_bps_interlayer:
  w_0:
    latex: "w_0"
    dim: [1, 2, -2, 0]
    unit: "J"
    desc: "Энергия дилатации/вспучивания в узлах AA"
  w_1:
    latex: "w_1"
    dim: [1, 2, -2, 0]
    unit: "J"
    val: 1.762e-20 # ~110 meV
    desc: "Энергия чистого сдвига интерфейса в зонах AB/BA"
  bps_ratio:
    latex: "w_0/w_1"
    dim: [0, 0, 0, 0]
    unit: "dimensionless"
    val: 0.81649658
    lean_thm: "TevTwistronics.mises_bps_ratio_exact"
    desc: "BPS-инвариант текучести Мизеса: sqrt(2/3)"

magic_angles_hierarchy:
  theta_m_2:
    latex: "\\theta_m^{(2)}"
    dim: [0, 0, 0, 0]
    unit: "deg"
    val: 1.082
    desc: "Первый магический угол бислоя TBG: (3*sqrt(3))/(4*pi) * (w_1*a)/(hbar*v_F)"
  theta_m_3:
    latex: "\\theta_m^{(3)}"
    dim: [0, 0, 0, 0]
    unit: "deg"
    val: 1.530
    lean_thm: "TevTwistronics.trilayer_eigenvalue_is_sqrt_two"
    desc: "Магический угол трехслойного графена TTG: sqrt(2) * theta_m^(2)"
  theta_m_4_plus:
    latex: "\\theta_m^{(4+)}"
    dim: [0, 0, 0, 0]
    unit: "deg"
    val: 1.751
    desc: "Старший магический угол 4-слойного графена: phi * theta_m^(2)"
  theta_m_4_minus:
    latex: "\\theta_m^{(4-)}"
    dim: [0, 0, 0, 0]
    unit: "deg"
    val: 0.669
    desc: "Младший магический угол 4-слойного графена: (1/phi) * theta_m^(2)"

superconductivity_and_topology:
  T_c_max:
    latex: "T_c^{\\text{max}}"
    dim: [0, 0, 0, 0]
    unit: "K"
    val: 3.18
    desc: "Критическая температура упругого спаривания Эшелби в узлах AA"
  eta_H:
    latex: "\\eta_H"
    dim: [1, 0, -1, 0]
    unit: "Pa*s*m"
    desc: "Квантованная холловская вязкость: hbar * n_e / 4"
  w_DW:
    latex: "w_{\\text{DW}}"
    dim: [0, 1, 0, 0]
    unit: "m"
    val: 8.1e-10
    desc: "Ширина солитонной доменной стенки (0.81 нм)"
